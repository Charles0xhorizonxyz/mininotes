name: Release

# Tag a commit v0.0.20 and this publishes that build. Nothing is published by a
# push to main: a release is a decision, not a side effect.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # A secret cannot be read in a step's `if`, so whether one is set is decided
    # once here and asked about by name below.
    env:
      SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # Three places name the version and they have to agree before anything is built: the tag, the
      # build's own versionName, and dist/latest.txt, which is the one line every installed pad reads
      # to learn whether it is behind. A tag ahead of that file publishes a build nobody is told about;
      # a file ahead of the tag tells everybody about a build that does not exist.
      - name: The tag, the build and latest.txt agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          BUILD=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle)
          SAID=$(tr -d ' \r\n' < dist/latest.txt)
          echo "tag=$TAG build=$BUILD latest.txt=$SAID"
          [ "$TAG" = "$BUILD" ] || { echo "::error::tag v$TAG but versionName is $BUILD"; exit 1; }
          [ "$TAG" = "$SAID" ] || { echo "::error::tag v$TAG but dist/latest.txt says $SAID"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, build
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Name it after the tag
        id: name
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Signed if a key is configured, unsigned otherwise. An unsigned APK still
      # installs; it just cannot be updated over a differently-signed one, which
      # the release notes say rather than leaving somebody to find out.
      - name: Sign
        id: sign
        if: env.SIGNING_KEY != ''
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/key.jks"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/zipalign" -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/key.jks" --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          echo "apk=$RUNNER_TEMP/signed.apk" >> "$GITHUB_OUTPUT"

      - name: Gather
        run: |
          set -euo pipefail
          mkdir -p out
          SRC="${{ steps.sign.outputs.apk }}"
          if [ -z "$SRC" ]; then
            SRC=android/app/build/outputs/apk/release/app-release-unsigned.apk
            NAME="Mininotes-${{ steps.name.outputs.version }}-unsigned.apk"
          else
            NAME="Mininotes-${{ steps.name.outputs.version }}.apk"
          fi
          cp "$SRC" "out/$NAME"
          ( cd out && sha256sum "$NAME" > "$NAME.sha256" )
          # And the same file under a name that never changes, so the website can link
          # releases/latest/download/Mininotes.apk and a download is one click. The
          # versioned name stays: it is what the app's own update fetches.
          if [ -n "${{ steps.sign.outputs.apk }}" ]; then
            cp "$SRC" out/Mininotes.apk
            ( cd out && sha256sum Mininotes.apk > Mininotes.apk.sha256 )
          fi
          ls -l out

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            Install: download the APK, check it with the `.sha256` beside it,
            and open it on the phone.

            The pad works on its own, and nothing else has to be installed to
            share between phones: it is its own Maxima node. See the README.

            Windows: download `Mininotes-Windows-….zip`, check it with the
            `.sha256` beside it, extract it and open `Mininotes\Mininotes.exe`.
            A PC already running Mininotes offers the update itself.

  # The Windows build of the same commit, added to the same release once the phone's is published. Every
  # PC reads dist/latest-windows.txt and then fetches releases/latest/download/Mininotes-Windows-<that>.zip,
  # so each release has to carry it, and the file and the build have to agree on its version.
  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: The Windows build and latest-windows.txt agree
        id: name
        shell: pwsh
        run: |
          $build = (Select-String -Path windows/build.gradle -Pattern "^version = '([^']*)'").Matches[0].Groups[1].Value
          $said = (Get-Content dist/latest-windows.txt -Raw).Trim()
          "windows build=$build latest-windows.txt=$said"
          if ($build -ne $said) { Write-Error "windows/build.gradle says $build but dist/latest-windows.txt says $said"; exit 1 }
          "version=$build" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and package
        shell: pwsh
        run: ./windows/build.ps1 -Package

      - name: Gather
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          $name = "Mininotes-Windows-${{ steps.name.outputs.version }}.zip"
          Copy-Item "dist/latest/$name" out/
          Copy-Item "dist/latest/$name.sha256" out/
          # The same zip under a name that never changes, for the website's one-click link.
          Copy-Item "dist/latest/$name" out/Mininotes-Windows.zip
          $hash = (Get-FileHash out/Mininotes-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Mininotes-Windows.zip" | Set-Content -Encoding ascii out/Mininotes-Windows.zip.sha256
          Get-ChildItem out

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
